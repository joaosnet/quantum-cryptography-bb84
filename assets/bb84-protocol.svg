<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090c10"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Marker Definitions for State Arrows -->
    <marker id="arr-z" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#38bdf8"/>
    </marker>
    <marker id="arr-x" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#a855f7"/>
    </marker>

    <!-- Glow Filters -->
    <filter id="title-glow" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-secure" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-alert" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="800" height="460" fill="url(#bg-grad)" rx="10"/>
  <rect width="800" height="460" fill="none" stroke="#30363d" stroke-width="1.5" rx="10"/>

  <!-- DECORATIVE GRID DOTS -->
  <g fill="#21262d" opacity="0.6">
    <circle cx="30" cy="30" r="1.5"/> <circle cx="770" cy="30" r="1.5"/>
    <circle cx="30" cy="430" r="1.5"/> <circle cx="770" cy="430" r="1.5"/>
    <circle cx="390" cy="30" r="1.5"/> <circle cx="390" cy="430" r="1.5"/>
  </g>

  <!-- TITLE -->
  <text x="400" y="34" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="20" font-weight="bold" fill="#f0f6fc" letter-spacing="1"
        filter="url(#title-glow)">PROTOCOLO BB84 — CARTÃO DE REFERÊNCIA</text>
  <text x="400" y="54" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="10.5" fill="#8b949e" letter-spacing="1.5">
    Os 4 Estados Quânticos  ·  Dinâmica de Sifting e Troca de Chaves
  </text>

  <!-- Vertical divider between panels -->
  <line x1="390" y1="75" x2="390" y2="435" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- LEFT PANEL — THE 4 QUANTUM STATES                   -->
  <!-- ═══════════════════════════════════════════════════ -->
  <text x="195" y="85" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="14" font-weight="bold" fill="#f0f6fc">OS 4 ESTADOS BB84</text>
  <text x="195" y="100" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="9" fill="#8b949e">Alice codifica cada bit em uma de duas bases físicas</text>

  <!-- Z BASIS header -->
  <rect x="18" y="112" width="354" height="20" fill="#0f172a" rx="4" stroke="#1e3a8a" stroke-width="1"/>
  <text x="195" y="126" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="10" font-weight="bold" fill="#38bdf8" letter-spacing="2">BASE Z — Retilínea  (+)</text>

  <!-- State |0⟩ -->
  <circle cx="102" cy="200" r="44" fill="#0f172a" stroke="#3b82f6" stroke-width="2.5"/>
  <line x1="62" y1="200" x2="142" y2="200" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="102" y1="235" x2="102" y2="168" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr-z)"/>
  <text x="102" y="215" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="18" font-weight="bold" fill="#bae6fd" filter="url(#glow-secure)">|0&#x27E9;</text>
  <text x="102" y="258" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="10" font-weight="bold" fill="#38bdf8">bit = 0</text>
  <text x="102" y="271" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="8.5" fill="#8b949e">polarização &#x2191; vertical</text>

  <!-- State |1⟩ -->
  <circle cx="286" cy="200" r="44" fill="#0f172a" stroke="#3b82f6" stroke-width="2.5"/>
  <line x1="246" y1="200" x2="326" y2="200" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="286" y1="165" x2="286" y2="232" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="278,227 294,227 286,237" fill="#38bdf8"/>
  <text x="286" y="215" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="18" font-weight="bold" fill="#bae6fd" filter="url(#glow-secure)">|1&#x27E9;</text>
  <text x="286" y="258" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="10" font-weight="bold" fill="#38bdf8">bit = 1</text>
  <text x="286" y="271" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="8.5" fill="#8b949e">polarização &#x2193; vertical</text>

  <!-- X BASIS header -->
  <rect x="18" y="286" width="354" height="20" fill="#1e113a" rx="4" stroke="#581c87" stroke-width="1"/>
  <text x="195" y="300" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="10" font-weight="bold" fill="#c084fc" letter-spacing="2">BASE X — Diagonal  (&#x2A01;)</text>

  <!-- State |+⟩ -->
  <circle cx="102" cy="373" r="44" fill="#1e113a" stroke="#a855f7" stroke-width="2.5"/>
  <line x1="62" y1="373" x2="142" y2="373" stroke="#4c1d95" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="73" y1="402" x2="127" y2="348" stroke="#c084fc" stroke-width="2.5"/>
  <polygon points="119,342 134,345 128,359" fill="#c084fc"/>
  <text x="102" y="388" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="18" font-weight="bold" fill="#e9d5ff" filter="url(#glow-secure)">|+&#x27E9;</text>
  <text x="102" y="431" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="10" font-weight="bold" fill="#c084fc">bit = 0</text>
  <text x="102" y="444" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="8.5" fill="#8b949e">polarização &#x2197; diagonal</text>

  <!-- State |−⟩ -->
  <circle cx="286" cy="373" r="44" fill="#1e113a" stroke="#a855f7" stroke-width="2.5"/>
  <line x1="246" y1="373" x2="326" y2="373" stroke="#4c1d95" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="257" y1="344" x2="311" y2="398" stroke="#c084fc" stroke-width="2.5"/>
  <polygon points="303,393 316,399 306,409" fill="#c084fc"/>
  <text x="286" y="388" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="18" font-weight="bold" fill="#e9d5ff" filter="url(#glow-secure)">|&#x2212;&#x27E9;</text>
  <text x="286" y="431" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="10" font-weight="bold" fill="#c084fc">bit = 1</text>
  <text x="286" y="444" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="8.5" fill="#8b949e">polarização &#x2198; diagonal</text>


  <!-- ═══════════════════════════════════════════════════ -->
  <!-- RIGHT PANEL — PROTOCOL EXCHANGE EXAMPLE             -->
  <!-- ═══════════════════════════════════════════════════ -->
  <text x="595" y="85" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="14" font-weight="bold" fill="#f0f6fc">TROCA DE CHAVES (EXEMPLO)</text>
  <text x="595" y="100" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="9" fill="#8b949e">4 qubits, bases aleatórias e processo de Sifting</text>

  <!-- Table header -->
  <rect x="400" y="112" width="380" height="22" fill="#21262d" rx="4"/>
  <text x="430" y="127" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#8b949e">Passo / Etapa</text>
  <text x="490" y="127" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" fill="#f0f6fc">Q0</text>
  <text x="550" y="127" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" fill="#f0f6fc">Q1</text>
  <text x="610" y="127" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" fill="#f0f6fc">Q2</text>
  <text x="670" y="127" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" fill="#f0f6fc">Q3</text>
  <text x="740" y="127" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#8b949e">Entidade</text>

  <!-- ROW 1: Alice's bits -->
  <rect x="400" y="136" width="380" height="26" fill="#0d1117"/>
  <text x="404" y="153" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#c4b5fd">Bit Original</text>
  <text x="490" y="153" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#c4b5fd">1</text>
  <text x="550" y="153" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#c4b5fd">0</text>
  <text x="610" y="153" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#c4b5fd">1</text>
  <text x="670" y="153" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#c4b5fd">0</text>
  <text x="740" y="153" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9.5" font-weight="bold" fill="#8b5cf6">Alice</text>

  <!-- ROW 2: Alice's bases -->
  <rect x="400" y="164" width="380" height="26" fill="#0f1318"/>
  <text x="404" y="181" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#c4b5fd">Base de Alice</text>
  <text x="490" y="181" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" fill="#c084fc">X</text>
  <text x="550" y="181" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" fill="#38bdf8">Z</text>
  <text x="610" y="181" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" fill="#c084fc">X</text>
  <text x="670" y="181" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" fill="#38bdf8">Z</text>
  <text x="740" y="181" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9.5" font-weight="bold" fill="#8b5cf6">Alice</text>

  <!-- ROW 3: Encoded states -->
  <rect x="400" y="192" width="380" height="26" fill="#0d1117"/>
  <text x="404" y="209" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#c4b5fd">Estado Enviado</text>
  <text x="490" y="209" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="bold" fill="#e9d5ff">|&#x2212;&#x27E9;</text>
  <text x="550" y="209" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="bold" fill="#bae6fd">|0&#x27E9;</text>
  <text x="610" y="209" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="bold" fill="#e9d5ff">|&#x2212;&#x27E9;</text>
  <text x="670" y="209" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="bold" fill="#bae6fd">|0&#x27E9;</text>
  <text x="740" y="209" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9.5" font-weight="bold" fill="#8b5cf6">Alice</text>

  <!-- Quantum Channel separator -->
  <rect x="400" y="220" width="380" height="22" fill="#161b22"/>
  <text x="590" y="234" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="9" fill="#38bdf8" opacity="0.6" letter-spacing="4">&#x2015;&#x2015;&#x2015; CANAL QUÂNTICO &#x2015;&#x2015;&#x2015;</text>

  <!-- ROW 4: Bob's bases -->
  <rect x="400" y="244" width="380" height="26" fill="#0f1318"/>
  <text x="404" y="261" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#93c5fd">Base de Bob</text>
  <text x="490" y="261" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" fill="#c084fc">X</text>
  <text x="550" y="261" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" fill="#38bdf8">Z</text>
  <text x="610" y="261" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" fill="#38bdf8">Z</text>
  <text x="670" y="261" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" fill="#c084fc">X</text>
  <text x="740" y="261" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9.5" font-weight="bold" fill="#3b82f6">Bob</text>

  <!-- ROW 5: Bob's results -->
  <rect x="400" y="272" width="380" height="26" fill="#0d1117"/>
  <text x="404" y="289" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#93c5fd">Medição Obtida</text>
  <text x="490" y="289" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#34d399">1</text>
  <text x="550" y="289" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#34d399">0</text>
  <text x="610" y="289" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#f59e0b">?</text>
  <text x="670" y="289" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#f59e0b">?</text>
  <text x="740" y="289" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9.5" font-weight="bold" fill="#3b82f6">Bob</text>

  <!-- ROW 6: Bases match? -->
  <rect x="400" y="300" width="380" height="26" fill="#0f1318"/>
  <text x="404" y="317" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#8b949e">Bases iguais?</text>
  <text x="490" y="317" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" fill="#34d399">&#x2714;</text>
  <text x="550" y="317" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" fill="#34d399">&#x2714;</text>
  <text x="610" y="317" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" fill="#ef4444">&#x2716;</text>
  <text x="670" y="317" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" fill="#ef4444">&#x2716;</text>
  <text x="740" y="317" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#8b949e">Canal Público</text>

  <!-- ROW 7: Keep bit? -->
  <rect x="400" y="328" width="380" height="26" fill="#0d1117"/>
  <text x="404" y="345" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#8b949e">Ação (Sifting)</text>
  <text x="490" y="345" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="bold" fill="#34d399">MANTER</text>
  <text x="550" y="345" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="bold" fill="#34d399">MANTER</text>
  <text x="610" y="345" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="bold" fill="#6b7280">DESCARTAR</text>
  <text x="670" y="345" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="bold" fill="#6b7280">DESCARTAR</text>
  <text x="740" y="345" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#8b949e">Clássico</text>

  <!-- Result banner -->
  <rect x="400" y="360" width="380" height="34" fill="#0f2a1a" stroke="#10b981" stroke-width="1.5" rx="4"/>
  <text x="590" y="374" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="10" font-weight="bold" fill="#6ee7b7" filter="url(#glow-secure)">&#x2713; Sifting concluído — Chave compartilhada:</text>
  <text x="590" y="388" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="14" font-weight="bold" fill="#34d399">Alice: 1 0  →  Bob: 1 0</text>

  <!-- QBER check box -->
  <rect x="400" y="400" width="380" height="45" fill="#1a0505" stroke="#ef4444" stroke-width="1.5" rx="4" stroke-dasharray="5,3"/>
  <text x="590" y="415" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="10" font-weight="bold" fill="#fca5a5" filter="url(#glow-alert)">Fase de Verificação (QBER Check)</text>
  
  <text x="490" y="432" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" fill="#34d399">&#x2264; 11% Erro</text>
  <text x="490" y="442" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="8.5" fill="#6ee7b7">&#x2192; Chave Segura</text>
  
  <text x="690" y="432" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" fill="#ef4444">&gt; 11% Erro</text>
  <text x="690" y="442" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="8.5" fill="#fca5a5">&#x2192; Alerta! Eve detectada</text>
</svg>