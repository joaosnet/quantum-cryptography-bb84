[project]
name = "quantum-tripwire"
version = "0.1.0"
description = "BB84 Quantum Key Distribution: NISQ simulation and novel partial Eve attack. Targeting COBENGE 2026."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "qiskit>=2.3.0",
    "qiskit-aer>=0.17.2",
    "qiskit-ibm-runtime>=0.45.1",
    "rich>=14.3.3",
]

[dependency-groups]
dev = [
    "docx2pdf>=0.1.8",
    "ipykernel>=7.2.0",
    "markdown>=3.10.2",
    "pymupdf>=1.27.1",
    "python-docx>=1.2.0",
    "ruff>=0.15.2",
]
[tool.ruff]
# Ignora avisos de imports fora do topo do arquivo
ignore = ["E402"]
