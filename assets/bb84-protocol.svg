<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arr-z" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arr-x" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="460" fill="url(#bg2)" rx="8"/>
  <rect width="800" height="460" fill="none" stroke="#30363d" stroke-width="1" rx="8"/>

  <!-- TITLE -->
  <text x="400" y="34" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="18" font-weight="bold" fill="#f0f6fc">BB84 Protocol — Reference Card</text>
  <text x="400" y="52" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="9.5" fill="#484f58" letter-spacing="1.5">
    The 4 Quantum States  ·  How the Key Exchange Works
  </text>

  <!-- Vertical divider between panels -->
  <line x1="390" y1="65" x2="390" y2="445" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- LEFT PANEL — THE 4 QUANTUM STATES                   -->
  <!-- ═══════════════════════════════════════════════════ -->
  <text x="195" y="80" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="13" font-weight="bold" fill="#e2e8f0">The 4 BB84 States</text>
  <text x="195" y="95" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="9" fill="#484f58">Alice encodes each bit in one of two bases</text>

  <!-- Z BASIS header -->
  <rect x="18" y="108" width="354" height="18" fill="#1e3a5f" rx="3" opacity="0.6"/>
  <text x="195" y="121" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="10" font-weight="bold" fill="#60a5fa" letter-spacing="2">Z BASIS — Rectilinear  (+)</text>

  <!-- State |0⟩ -->
  <circle cx="102" cy="195" r="44" fill="#0c1a3b" stroke="#3b82f6" stroke-width="2"/>
  <line x1="62" y1="195" x2="142" y2="195" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="102" y1="230" x2="102" y2="163" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-z)"/>
  <text x="102" y="210" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="18" font-weight="bold" fill="#93c5fd">|0&#x27E9;</text>
  <text x="102" y="252" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="10" fill="#60a5fa">bit = 0</text>
  <text x="102" y="265" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="8.5" fill="#484f58">vertical &#x2191; polarization</text>

  <!-- State |1⟩ -->
  <circle cx="286" cy="195" r="44" fill="#0c1a3b" stroke="#3b82f6" stroke-width="2"/>
  <line x1="246" y1="195" x2="326" y2="195" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="286" y1="160" x2="286" y2="227" stroke="#3b82f6" stroke-width="2.5"/>
  <polygon points="278,222 294,222 286,232" fill="#3b82f6"/>
  <text x="286" y="210" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="18" font-weight="bold" fill="#93c5fd">|1&#x27E9;</text>
  <text x="286" y="252" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="10" fill="#60a5fa">bit = 1</text>
  <text x="286" y="265" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="8.5" fill="#484f58">vertical &#x2193; polarization</text>

  <!-- X BASIS header -->
  <rect x="18" y="282" width="354" height="18" fill="#2e1065" rx="3" opacity="0.6"/>
  <text x="195" y="295" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="10" font-weight="bold" fill="#a78bfa" letter-spacing="2">X BASIS — Diagonal  (&#x2A01;)</text>

  <!-- State |+⟩ -->
  <circle cx="102" cy="368" r="44" fill="#1e0b3b" stroke="#a855f7" stroke-width="2"/>
  <line x1="62" y1="368" x2="142" y2="368" stroke="#2e1065" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="73" y1="397" x2="127" y2="343" stroke="#a855f7" stroke-width="2.5"/>
  <polygon points="119,337 134,340 128,354" fill="#a855f7"/>
  <text x="102" y="382" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="18" font-weight="bold" fill="#c4b5fd">|+&#x27E9;</text>
  <text x="102" y="425" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="10" fill="#a78bfa">bit = 0</text>
  <text x="102" y="438" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="8.5" fill="#484f58">diagonal &#x2197; polarization</text>

  <!-- State |−⟩ -->
  <circle cx="286" cy="368" r="44" fill="#1e0b3b" stroke="#a855f7" stroke-width="2"/>
  <line x1="246" y1="368" x2="326" y2="368" stroke="#2e1065" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="257" y1="339" x2="311" y2="393" stroke="#a855f7" stroke-width="2.5"/>
  <polygon points="303,388 316,394 306,404" fill="#a855f7"/>
  <text x="286" y="382" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="18" font-weight="bold" fill="#c4b5fd">|&#x2212;&#x27E9;</text>
  <text x="286" y="425" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="10" fill="#a78bfa">bit = 1</text>
  <text x="286" y="438" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="8.5" fill="#484f58">diagonal &#x2198; polarization</text>

  <text x="20" y="455" font-family="'Courier New', Courier, monospace" font-size="8" fill="#3b82f6">Z basis (blue) = Rectilinear   </text>
  <text x="197" y="455" font-family="'Courier New', Courier, monospace" font-size="8" fill="#a855f7">X basis (purple) = Diagonal</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- RIGHT PANEL — PROTOCOL EXCHANGE EXAMPLE             -->
  <!-- ═══════════════════════════════════════════════════ -->
  <text x="595" y="80" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="13" font-weight="bold" fill="#e2e8f0">Protocol Exchange</text>
  <text x="595" y="95" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="9" fill="#484f58">Example: 4 qubits, random bases, sifting</text>

  <!-- Table header -->
  <rect x="400" y="102" width="390" height="22" fill="#21262d" rx="3"/>
  <text x="430" y="117" font-family="'Courier New', Courier, monospace" font-size="9" fill="#8b949e">Role</text>
  <text x="490" y="117" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="bold" fill="#f0f6fc">Q0</text>
  <text x="550" y="117" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="bold" fill="#f0f6fc">Q1</text>
  <text x="610" y="117" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="bold" fill="#f0f6fc">Q2</text>
  <text x="670" y="117" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="bold" fill="#f0f6fc">Q3</text>
  <text x="748" y="117" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#8b949e">Source</text>

  <!-- ROW 1: Alice's bits -->
  <rect x="400" y="125" width="390" height="26" fill="#0d1117"/>
  <text x="404" y="142" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#c4b5fd">Alice bit</text>
  <text x="490" y="142" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#c4b5fd">1</text>
  <text x="550" y="142" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#c4b5fd">0</text>
  <text x="610" y="142" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#c4b5fd">1</text>
  <text x="670" y="142" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#c4b5fd">0</text>
  <text x="748" y="142" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#6d28d9">Alice</text>

  <!-- ROW 2: Alice's bases -->
  <rect x="400" y="152" width="390" height="26" fill="#0f1318"/>
  <text x="404" y="169" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#c4b5fd">Alice basis</text>
  <text x="490" y="169" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#a855f7">X</text>
  <text x="550" y="169" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#3b82f6">Z</text>
  <text x="610" y="169" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#a855f7">X</text>
  <text x="670" y="169" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#3b82f6">Z</text>
  <text x="748" y="169" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#6d28d9">Alice</text>

  <!-- ROW 3: Encoded states -->
  <rect x="400" y="179" width="390" height="26" fill="#0d1117"/>
  <text x="404" y="196" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#c4b5fd">Alice state</text>
  <text x="490" y="196" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#a855f7">|&#x2212;&#x27E9;</text>
  <text x="550" y="196" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#3b82f6">|0&#x27E9;</text>
  <text x="610" y="196" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#a855f7">|&#x2212;&#x27E9;</text>
  <text x="670" y="196" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#3b82f6">|0&#x27E9;</text>
  <text x="748" y="196" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#6d28d9">Alice</text>

  <!-- Quantum Channel separator -->
  <rect x="400" y="206" width="390" height="20" fill="#161b22"/>
  <text x="595" y="219" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="8.5" fill="#30363d" letter-spacing="4">&#x2015;&#x2015;&#x2015; QUANTUM CHANNEL &#x2015;&#x2015;&#x2015;</text>

  <!-- ROW 4: Bob's bases -->
  <rect x="400" y="227" width="390" height="26" fill="#0f1318"/>
  <text x="404" y="244" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#93c5fd">Bob basis</text>
  <text x="490" y="244" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#a855f7">X</text>
  <text x="550" y="244" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#3b82f6">Z</text>
  <text x="610" y="244" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#3b82f6">Z</text>
  <text x="670" y="244" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#a855f7">X</text>
  <text x="748" y="244" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#1d4ed8">Bob</text>

  <!-- ROW 5: Bob's results -->
  <rect x="400" y="254" width="390" height="26" fill="#0d1117"/>
  <text x="404" y="271" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#93c5fd">Bob result</text>
  <text x="490" y="271" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#22c55e">1</text>
  <text x="550" y="271" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#22c55e">0</text>
  <text x="610" y="271" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#f59e0b">?</text>
  <text x="670" y="271" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#f59e0b">?</text>
  <text x="748" y="271" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#1d4ed8">Bob</text>

  <!-- ROW 6: Bases match? -->
  <rect x="400" y="281" width="390" height="26" fill="#0f1318"/>
  <text x="404" y="298" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#8b949e">Bases match?</text>
  <text x="490" y="298" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" fill="#22c55e">&#x2714;</text>
  <text x="550" y="298" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" fill="#22c55e">&#x2714;</text>
  <text x="610" y="298" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" fill="#ef4444">&#x2716;</text>
  <text x="670" y="298" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" fill="#ef4444">&#x2716;</text>
  <text x="748" y="298" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#484f58">Classical</text>

  <!-- ROW 7: Keep bit? -->
  <rect x="400" y="308" width="390" height="26" fill="#0d1117"/>
  <text x="404" y="325" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#8b949e">Keep bit?</text>
  <text x="490" y="325" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="bold" fill="#22c55e">YES</text>
  <text x="550" y="325" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="bold" fill="#22c55e">YES</text>
  <text x="610" y="325" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="bold" fill="#6b7280">NO</text>
  <text x="670" y="325" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="bold" fill="#6b7280">NO</text>
  <text x="748" y="325" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#484f58">Sifting</text>

  <!-- Result banner -->
  <rect x="400" y="340" width="390" height="34" fill="#0f2a0f" stroke="#22c55e" stroke-width="1.5" rx="4"/>
  <text x="595" y="354" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="10" fill="#86efac">&#x2713; Sifting complete — shared key bits:</text>
  <text x="595" y="368" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="14" font-weight="bold" fill="#22c55e">Alice: 1 0  →  Bob: 1 0</text>

  <!-- QBER check box -->
  <rect x="400" y="380" width="390" height="60" fill="#1a0505" stroke="#dc2626" stroke-width="1" rx="4" stroke-dasharray="5,3"/>
  <text x="595" y="397" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="9.5" fill="#fca5a5">QBER Check: sample a subset of kept bits</text>
  <text x="595" y="411" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="9" fill="#6b7280">QBER = (wrong bits) / (total compared bits)</text>
  <text x="490" y="430" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#22c55e">&#x2264;11%</text>
  <text x="490" y="441" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="8" fill="#22c55e">&#x2192; Key OK</text>
  <text x="630" y="430" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#ef4444">&gt;11%</text>
  <text x="630" y="441" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="8" fill="#ef4444">&#x2192; Abort! Eve found</text>

  <text x="595" y="452" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="7.5" fill="#484f58">~50% efficiency loss from sifting is normal and expected</text>
</svg>
