<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="alice-fill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <radialGradient id="bob-fill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0c1a3b"/>
    </radialGradient>
    <radialGradient id="eve-fill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#3b0000"/>
    </radialGradient>
    <filter id="glow-c" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-r" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="title-glow" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="900" height="280" fill="url(#bg-grad)" rx="8"/>
  <rect width="900" height="280" fill="none" stroke="#30363d" stroke-width="1" rx="8"/>

  <!-- Decorative corner dots -->
  <g fill="#21262d" opacity="0.55">
    <circle cx="30"  cy="28"  r="1.5"/> <circle cx="78"  cy="28"  r="1.5"/>
    <circle cx="822" cy="28"  r="1.5"/> <circle cx="870" cy="28"  r="1.5"/>
    <circle cx="30"  cy="252" r="1.5"/> <circle cx="78"  cy="252" r="1.5"/>
    <circle cx="822" cy="252" r="1.5"/> <circle cx="870" cy="252" r="1.5"/>
    <circle cx="220" cy="78"  r="1.5"/> <circle cx="268" cy="78"  r="1.5"/>
    <circle cx="632" cy="78"  r="1.5"/> <circle cx="680" cy="78"  r="1.5"/>
    <circle cx="220" cy="210" r="1.5"/> <circle cx="268" cy="210" r="1.5"/>
    <circle cx="632" cy="210" r="1.5"/> <circle cx="680" cy="210" r="1.5"/>
    <circle cx="450" cy="28"  r="1.5"/> <circle cx="450" cy="252" r="1.5"/>
  </g>

  <!-- TITLE -->
  <text x="450" y="35" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="22" font-weight="bold" fill="#f0f6fc" letter-spacing="1"
        filter="url(#title-glow)">BB84 Quantum Key Distribution</text>
  <text x="450" y="54" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="10.5" fill="#484f58" letter-spacing="1.5">
    quantum-cryptography-bb84  ·  UFPA, Brazil  ·  COBENGE 2026  ·  Qiskit
  </text>

  <!-- QUANTUM CHANNEL -->
  <line x1="165" y1="145" x2="735" y2="145" stroke="#0ea5e9" stroke-width="12" opacity="0.04"/>
  <line x1="165" y1="145" x2="735" y2="145" stroke="#30363d" stroke-width="2" stroke-dasharray="9,5"/>
  <text x="450" y="133" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="8.5" fill="#484f58" letter-spacing="3">QUANTUM  CHANNEL</text>

  <!-- EVE -->
  <circle cx="450" cy="82" r="26" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.15">
    <animate attributeName="r"       values="26;44"   dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0"   dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <line x1="450" y1="107" x2="450" y2="133" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.75"/>
  <circle cx="450" cy="145" r="5" fill="#dc2626" opacity="0.35">
    <animate attributeName="r"       values="4;10;4"              dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.75;0.35"      dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="82" r="24" fill="url(#eve-fill)" stroke="#dc2626" stroke-width="2.2"/>
  <ellipse cx="450" cy="79" rx="9" ry="4.5" fill="none" stroke="#f87171" stroke-width="1.5"/>
  <circle cx="450" cy="79" r="3" fill="#f87171"/>
  <circle cx="451" cy="78" r="1" fill="#3b0000"/>
  <text x="450" y="94" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="11" font-weight="bold" fill="#fca5a5">EVE</text>
  <text x="483" y="75" font-family="'Courier New', Courier, monospace" font-size="8" fill="#ef4444" opacity="0.65">&#x26A1; intercept-resend</text>
  <text x="483" y="87" font-family="'Courier New', Courier, monospace" font-size="8" fill="#ef4444" opacity="0.45">QBER &#x2191; = Eve detected</text>

  <!-- ALICE -->
  <circle cx="120" cy="145" r="46" fill="none" stroke="#7c3aed" stroke-width="1.2" opacity="0.2">
    <animate attributeName="r"       values="46;62;46" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="145" r="44" fill="url(#alice-fill)" stroke="#7c3aed" stroke-width="2.5"/>
  <line x1="120" y1="129" x2="120" y2="118" stroke="#a78bfa" stroke-width="2.2"/>
  <path d="M 107 125 A 15 12 0 0 1 133 125" fill="none" stroke="#a78bfa" stroke-width="1.8"/>
  <path d="M 112 121 A 9  8  0 0 1 128 121" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="120" cy="129" r="2.5" fill="#c4b5fd"/>
  <text x="120" y="153" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="13" font-weight="bold" fill="#c4b5fd">ALICE</text>
  <text x="120" y="200" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="8.5" fill="#6d28d9">key sender · encodes qubits</text>
  <text x="154" y="141" font-family="'Courier New', Courier, monospace" font-size="13" fill="#7c3aed" opacity="0.5">&#x2192;</text>

  <!-- BOB -->
  <circle cx="780" cy="145" r="46" fill="none" stroke="#2563eb" stroke-width="1.2" opacity="0.2">
    <animate attributeName="r"       values="46;62;46" dur="5s" repeatCount="indefinite" begin="2.5s"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="5s" repeatCount="indefinite" begin="2.5s"/>
  </circle>
  <circle cx="780" cy="145" r="44" fill="url(#bob-fill)" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="768" y="121" width="24" height="16" rx="3" fill="none" stroke="#60a5fa" stroke-width="1.8"/>
  <circle cx="773" cy="129" r="2.5" fill="#60a5fa" opacity="0.7"/>
  <circle cx="787" cy="129" r="2.5" fill="#60a5fa" opacity="0.7"/>
  <line x1="780" y1="137" x2="780" y2="149" stroke="#60a5fa" stroke-width="2.2"/>
  <text x="780" y="156" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="13" font-weight="bold" fill="#93c5fd">BOB</text>
  <text x="780" y="200" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="8.5" fill="#1d4ed8">key receiver · measures qubits</text>
  <text x="737" y="141" font-family="'Courier New', Courier, monospace" font-size="13" fill="#2563eb" opacity="0.5">&#x2192;</text>

  <!-- ANIMATED PHOTONS -->
  <!-- Photon A — secure (cyan), starts at Alice -->
  <circle cx="165" cy="145" r="6" fill="#06b6d4" filter="url(#glow-c)">
    <animateTransform attributeName="transform" type="translate"
                      from="0 0" to="570 0"
                      dur="3.5s" repeatCount="indefinite" begin="0s"/>
  </circle>

  <!-- Photon B — secure (cyan), pre-positioned 25% along channel -->
  <circle cx="165" cy="145" r="6" fill="#06b6d4" filter="url(#glow-c)">
    <animateTransform attributeName="transform" type="translate"
                      from="0 0" to="570 0"
                      dur="3.5s" repeatCount="indefinite" begin="-0.875s"/>
  </circle>

  <!-- Photon C — INTERCEPTED by Eve (pre-positioned at 50% = Eve's position) -->
  <circle cx="165" cy="145" r="6" filter="url(#glow-r)">
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 272 0; 298 0; 570 0"
                      keyTimes="0; 0.44; 0.56; 1"
                      dur="3.5s" repeatCount="indefinite" begin="-1.75s"/>
    <animate attributeName="fill"
             values="#06b6d4; #06b6d4; #fbbf24; #ef4444; #dc2626; #dc2626"
             keyTimes="0; 0.42; 0.48; 0.52; 0.58; 1"
             dur="3.5s" repeatCount="indefinite" begin="-1.75s"/>
    <animate attributeName="r"
             values="6; 6; 12; 12; 6; 6"
             keyTimes="0; 0.42; 0.48; 0.56; 0.62; 1"
             dur="3.5s" repeatCount="indefinite" begin="-1.75s"/>
  </circle>

  <!-- Photon D — secure (cyan), pre-positioned 75% along channel -->
  <circle cx="165" cy="145" r="6" fill="#06b6d4" filter="url(#glow-c)">
    <animateTransform attributeName="transform" type="translate"
                      from="0 0" to="570 0"
                      dur="3.5s" repeatCount="indefinite" begin="-2.625s"/>
  </circle>

  <!-- LEGEND / FOOTER -->
  <line x1="30" y1="220" x2="870" y2="220" stroke="#21262d" stroke-width="1"/>
  <circle cx="50"  cy="237" r="5" fill="#06b6d4" filter="url(#glow-c)"/>
  <text x="61" y="241" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#8b949e">secure photon</text>
  <circle cx="174" cy="237" r="5" fill="#dc2626" filter="url(#glow-r)"/>
  <text x="185" y="241" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#8b949e">intercepted photon</text>
  <circle cx="330" cy="237" r="6" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="341" y="241" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#8b949e">Alice (Tx)</text>
  <circle cx="430" cy="237" r="6" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="441" y="241" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#8b949e">Bob (Rx)</text>
  <circle cx="530" cy="237" r="5" fill="#dc2626" opacity="0.7"/>
  <text x="541" y="241" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#8b949e">Eve (eavesdropper)</text>
  <text x="700" y="234" font-family="'Courier New', Courier, monospace" font-size="8" fill="#484f58">No-Cloning Theorem</text>
  <text x="700" y="246" font-family="'Courier New', Courier, monospace" font-size="8" fill="#484f58">&#x2192; Eve always leaves a trace</text>
</svg>
